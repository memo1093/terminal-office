appId: com.mehmetakyer.terminaloffice
productName: Terminal Office
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# node-pty ships native binaries (and spawn-helper on macOS/Linux) that must live outside the asar.
asarUnpack:
  - node_modules/@lydell/**
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Pixel-art wizard images (generated by `npm run icons`).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
# DMG window: background is build/background.tiff (Retina, made in CI from the two PNGs)
# or build/background.png; icons sit on the background's left/right slots.
dmg:
  title: ${productName} ${version}
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 190
    - x: 410
      y: 190
      type: link
      path: /Applications
linux:
  icon: build/icon.png
  category: Development
  maintainer: Mehmet Akyer
  synopsis: Pixel-art office that visualizes your running terminals
  target:
    - AppImage
    - deb
